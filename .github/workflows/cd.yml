# Continuous Deployment Workflow
# Deploys to Kubernetes on main branch push

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: task-manager-api

jobs:
  # ==========================================================================
  # Build and Push Docker Image
  # ==========================================================================
  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.REGISTRY_URL }}/${{ env.DOCKER_IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Sign the container image
        if: false  # Enable when you have cosign set up
        run: |
          echo "Container signing with cosign would happen here"
          # cosign sign --key cosign.key ${{ secrets.REGISTRY_URL }}/${{ env.DOCKER_IMAGE }}@${{ steps.build.outputs.digest }}

  # ==========================================================================
  # Deploy to Development
  # ==========================================================================
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    environment:
      name: development
      url: https://dev-api.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image in kustomization
        run: |
          cd deploy/k8s/overlays/dev
          kustomize edit set image task-manager-api=${{ secrets.REGISTRY_URL }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -k deploy/k8s/overlays/dev/
          kubectl rollout status deployment/task-manager-dev -n task-manager-dev --timeout=300s

      - name: Verify deployment
        run: |
          kubectl get pods -n task-manager-dev -l app=task-manager
          kubectl get svc -n task-manager-dev

      - name: Run smoke tests
        run: |
          # Wait for service to be ready
          sleep 30
          
          # Get the service URL (adjust based on your setup)
          # For LoadBalancer:
          # SERVICE_URL=$(kubectl get svc task-manager-dev -n task-manager-dev -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          
          # For port-forward test:
          kubectl port-forward svc/task-manager-dev 8080:80 -n task-manager-dev &
          sleep 5
          
          # Health check
          curl -f http://localhost:8080/health || exit 1
          
          echo "Smoke tests passed!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Deployment to dev failed!"
          # Add Slack/Teams notification here

  # ==========================================================================
  # Deploy to Production
  # ==========================================================================
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-push, deploy-dev]
    if: github.event.inputs.environment == 'prod'
    environment:
      name: production
      url: https://api.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update image in kustomization
        run: |
          cd deploy/k8s/overlays/prod
          kustomize edit set image task-manager-api=${{ secrets.REGISTRY_URL }}/${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Deploy to Kubernetes (canary - 25%)
        run: |
          # First, scale to ensure we have enough replicas for canary
          kubectl scale deployment/task-manager-prod -n task-manager-prod --replicas=4
          
          # Apply new deployment
          kubectl apply -k deploy/k8s/overlays/prod/
          
          # Wait for one pod to be ready with new version
          kubectl rollout status deployment/task-manager-prod -n task-manager-prod --timeout=300s

      - name: Run production smoke tests
        run: |
          sleep 30
          
          # Port-forward for testing
          kubectl port-forward svc/task-manager-prod 8080:80 -n task-manager-prod &
          sleep 5
          
          # Health check
          curl -f http://localhost:8080/health || exit 1
          
          # Ready check
          curl -f http://localhost:8080/ready || exit 1
          
          echo "Production smoke tests passed!"

      - name: Complete rollout
        run: |
          kubectl rollout status deployment/task-manager-prod -n task-manager-prod --timeout=600s
          echo "Production deployment complete!"

      - name: Notify on success
        run: |
          echo "Successfully deployed to production!"
          # Add Slack/Teams notification here

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed, initiating rollback..."
          kubectl rollout undo deployment/task-manager-prod -n task-manager-prod
          kubectl rollout status deployment/task-manager-prod -n task-manager-prod
          echo "Rollback complete"

  # ==========================================================================
  # Post-Deployment Tasks
  # ==========================================================================
  post-deploy:
    name: Post-Deployment
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: always() && needs.deploy-dev.result == 'success'
    
    steps:
      - name: Create deployment record
        run: |
          echo "Recording deployment..."
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Add to your deployment tracking system

      - name: Update deployment dashboard
        run: |
          echo "Updating metrics dashboard..."
          # Send deployment event to Prometheus/Grafana
          # curl -X POST https://grafana.example.com/api/annotations ...
