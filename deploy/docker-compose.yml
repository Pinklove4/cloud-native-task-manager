# Docker Compose for local development
# Usage: docker-compose -f deploy/docker-compose.yml up --build

version: "3.9"

services:
  # ==========================================================================
  # Task Manager API
  # ==========================================================================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: task-manager-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/taskmanager
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-development-secret-change-in-production}
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - PROMETHEUS_ENABLED=true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - task-manager-network

  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  db:
    image: postgres:15-alpine
    container_name: task-manager-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskmanager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - task-manager-network

  # ==========================================================================
  # Prometheus (Metrics Collection) - Optional for local dev
  # ==========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: task-manager-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - task-manager-network
    profiles:
      - observability

  # ==========================================================================
  # Grafana (Dashboards) - Optional for local dev
  # ==========================================================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: task-manager-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - task-manager-network
    profiles:
      - observability

  # ==========================================================================
  # Loki (Log Aggregation) - Optional for local dev
  # ==========================================================================
  loki:
    image: grafana/loki:2.9.2
    container_name: task-manager-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - task-manager-network
    profiles:
      - observability

networks:
  task-manager-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
