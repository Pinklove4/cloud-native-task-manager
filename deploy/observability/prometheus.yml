# Prometheus configuration for Task Manager API

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Task Manager API metrics
  - job_name: 'task-manager-api'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
    scheme: http
