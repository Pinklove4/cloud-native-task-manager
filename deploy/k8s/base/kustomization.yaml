# Kustomization file for base Kubernetes resources
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: task-manager

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

commonLabels:
  app: task-manager
  app.kubernetes.io/name: task-manager
  app.kubernetes.io/component: api
  app.kubernetes.io/part-of: task-manager-system
