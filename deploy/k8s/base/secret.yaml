# Secret for sensitive configuration
# NOTE: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
# These values are base64 encoded placeholders - CHANGE BEFORE DEPLOYING
#
# To encode a value: echo -n 'your-value' | base64
# To decode a value: echo 'encoded-value' | base64 -d
#
apiVersion: v1
kind: Secret
metadata:
  name: task-manager-secrets
  namespace: task-manager
type: Opaque
data:
  # DATABASE_URL: base64 encoded PostgreSQL connection string
  # Example: postgresql://user:password@host:5432/dbname
  # Placeholder value: <CHANGE_ME>
  DATABASE_URL: PENIQU5HRV9NRT4=
  
  # JWT_SECRET_KEY: base64 encoded secret key for JWT signing
  # Generate with: openssl rand -base64 32
  # Placeholder value: <CHANGE_ME>
  JWT_SECRET_KEY: PENIQU5HRV9NRT4=
---
# How to create this secret properly:
#
# Option 1: kubectl create secret (recommended for initial setup)
# kubectl create secret generic task-manager-secrets \
#   --namespace=task-manager \
#   --from-literal=DATABASE_URL='postgresql://user:password@host:5432/dbname' \
#   --from-literal=JWT_SECRET_KEY='your-secure-random-key'
#
# Option 2: External Secrets Operator (production recommended)
# Use ExternalSecret CRD to fetch from AWS Secrets Manager, Vault, etc.
#
# Option 3: Sealed Secrets (GitOps friendly)
# Use Bitnami Sealed Secrets to encrypt secrets in Git
