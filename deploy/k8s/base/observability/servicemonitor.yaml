# ServiceMonitor for Prometheus Operator
# This tells Prometheus how to scrape the Task Manager API
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: task-manager
  namespace: task-manager
  labels:
    app: task-manager
    release: prometheus  # Match your Prometheus Operator release
spec:
  selector:
    matchLabels:
      app: task-manager
  namespaceSelector:
    matchNames:
      - task-manager
      - task-manager-dev
      - task-manager-prod
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      scheme: http
